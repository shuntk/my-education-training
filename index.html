<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#ffd56a" />
    <title>さんすう10もんチャレンジ</title>
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="stylesheet" href="./styles.css?v=12" />
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <button class="icon-button" id="homeButton" type="button" aria-label="ホーム">
          <span aria-hidden="true">⌂</span>
        </button>
        <div>
          <p class="eyebrow">1・2年生のさんすう</p>
          <h1>さんすう10もんチャレンジ</h1>
        </div>
        <button class="icon-button" id="soundButton" type="button" aria-label="音のオンオフ">
          <span aria-hidden="true">♪</span>
        </button>
      </header>

      <main>
        <section class="screen active" id="homeScreen" aria-labelledby="homeTitle">
          <div class="hero-grid">
            <div class="hero-copy">
              <h2 id="homeTitle">きょうは、どの力をのばす？</h2>
              <p>
                10問をテンポよく解いて、正解数と時間を記録します。
                新記録のときは紙ふぶきでお祝いします。
              </p>
              <div class="profile-picker">
                <label for="playerSelect">なまえ</label>
                <div class="inline-row">
                  <select id="playerSelect"></select>
                  <button id="addPlayerButton" class="secondary-button" type="button">＋</button>
                </div>
                <button id="openRankingButton" class="secondary-button wide-button" type="button">
                  ランキングを見る
                </button>
              </div>
            </div>
            <div class="mascot-stage" aria-hidden="true">
              <div class="sun"></div>
              <div class="character">
                <div class="face">
                  <span class="eye left"></span>
                  <span class="eye right"></span>
                  <span class="smile"></span>
                </div>
                <div class="pencil"></div>
              </div>
              <div class="number-card one">7+5</div>
              <div class="number-card two">23-8</div>
            </div>
          </div>

          <div class="mode-tabs" role="tablist" aria-label="問題の種類">
            <button class="tab active" data-mode="mix" type="button">ミックス</button>
            <button class="tab" data-mode="add" type="button">たし算</button>
            <button class="tab" data-mode="sub" type="button">ひき算</button>
          </div>

          <div class="level-grid" id="levelGrid"></div>

          <section class="coach-panel" aria-label="学びのヒント">
            <h3>育て方メモ</h3>
            <ul>
              <li>速さだけでなく、まずは「10問やり切った」を大事にします。</li>
              <li>まちがえた問題は最後に見直せます。責めずに作戦を一緒に探せます。</li>
              <li>新記録は同じレベル内だけで判定します。比べる相手は昨日の自分です。</li>
            </ul>
          </section>
        </section>

        <section class="screen" id="quizScreen" aria-labelledby="quizTitle">
          <div class="quiz-status">
            <div>
              <p class="eyebrow" id="quizLevelLabel"></p>
              <h2 id="quizTitle">もんだい</h2>
            </div>
            <div class="status-pills">
              <span id="questionCounter">1 / 10</span>
              <span id="timerDisplay">0びょう</span>
            </div>
          </div>

          <div class="progress-track" aria-hidden="true">
            <div id="progressFill"></div>
          </div>

          <div class="problem-board">
            <div class="problem" id="problemText">8 + 4</div>
            <div class="answer-row">
              <input
                id="answerInput"
                type="number"
                inputmode="numeric"
                autocomplete="off"
                aria-label="答え"
              />
              <button id="submitAnswerButton" class="primary-button" type="button">こたえる</button>
            </div>
            <p class="feedback" id="feedbackText" aria-live="polite"></p>
            <div class="visual-hint" id="visualHint" aria-live="polite"></div>
          </div>

          <div class="keypad" id="keypad" aria-label="数字キー"></div>
        </section>

        <section class="screen" id="resultScreen" aria-labelledby="resultTitle">
          <div class="result-header">
            <p class="eyebrow" id="resultPlayer"></p>
            <h2 id="resultTitle">できた！</h2>
            <p id="resultSummary"></p>
          </div>
          <div class="result-actions">
            <button id="retryButton" class="primary-button" type="button">もういちど</button>
            <button id="rankingButton" class="secondary-button" type="button">ランキング</button>
          </div>
          <section class="review-panel" id="reviewPanel" aria-label="見直し"></section>
        </section>

        <section class="screen" id="rankingScreen" aria-labelledby="rankingTitle">
          <div class="ranking-header">
            <div>
              <p class="eyebrow">きろく</p>
              <h2 id="rankingTitle">ランキング</h2>
            </div>
            <select id="rankingLevelSelect" aria-label="ランキングのレベル"></select>
          </div>
          <div id="rankingList" class="ranking-list"></div>
        </section>
      </main>
    </div>

    <div class="celebration" id="celebration" aria-hidden="true"></div>
    <dialog id="playerDialog">
      <form method="dialog" class="dialog-card">
        <h2>なまえを登録</h2>
        <input id="newPlayerName" maxlength="12" autocomplete="off" placeholder="れい: はる" />
        <div class="dialog-actions">
          <button class="secondary-button" value="cancel" type="submit">やめる</button>
          <button id="savePlayerButton" class="primary-button" value="default" type="button">登録</button>
        </div>
      </form>
    </dialog>

    <script src="./app.js?v=12" type="module"></script>
  </body>
</html>
